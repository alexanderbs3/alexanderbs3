name: Update GitHub Stats Cards

on:
  schedule:
    - cron: "0 3 * * *"   # Roda todo dia às 03h UTC
  workflow_dispatch:        # Permite rodar manualmente também

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Stats Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: >
            username=alexanderbs3
            &show_icons=true
            &hide_border=true
            &bg_color=0d1117
            &title_color=0a9396
            &icon_color=f7b731
            &text_color=c9d1d9
            &include_all_commits=true
            &count_private=true
            &rank_icon=github
          path: profile/stats.svg
        env:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: >
            username=alexanderbs3
            &layout=compact
            &hide_border=true
            &bg_color=0d1117
            &title_color=0a9396
            &text_color=c9d1d9
            &langs_count=8
          path: profile/langs.svg
        env:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/langs.svg
          git diff --staged --quiet || git commit -m "chore: update stats cards [skip ci]"
          git push
